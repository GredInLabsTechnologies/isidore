name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Windows is where isidore is developed; Linux is where most users run it. Both, because path
    # separators and line endings are exactly where a scanner is wrong on one and right on the other.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e . pytest pytest-timeout ruff vulture
      - name: Git identity for the tests that commit into temporary repositories
        run: |
          git config --global user.email "ci@isidore.invalid"
          git config --global user.name "isidore-ci"
      - name: ruff
        run: ruff check src tests
      - name: vulture
        run: vulture src/isidore tests --min-confidence 80
      - name: pytest
        run: python -m pytest -q --timeout=300
      - name: isidore verifies its own wiki (0 LLM)
        run: |
          isidore scan --repo .
          isidore verify --repo . --contracts
          isidore claims --check --repo .
